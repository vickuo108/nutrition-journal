<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#284b36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日常食記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/app-icon.svg">
<link rel="apple-touch-icon" href="icons/app-icon.svg">
<title>日常食記 · Vic</title>
<style>
:root{--green:#284b36;--green-2:#426b4f;--sage:#70917a;--mint:#edf3e8;--cream:#fbfaf4;--card:#fff;--line:#dfe7d8;--text:#20372a;--muted:#718075;--danger:#ba3d35;--shadow:0 12px 28px rgba(30,54,38,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}textarea{resize:vertical}
.app{height:100dvh;max-width:520px;margin:0 auto;background:var(--cream);display:flex;flex-direction:column;position:relative}
.topbar{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.top-main{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:999px;background:var(--mint);display:grid;place-items:center;color:var(--green);font-size:24px}.brand h1{font-size:20px;line-height:1;font-weight:900}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:11px;letter-spacing:.12em}.month-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}.sync-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}.pill,.sync-pill{border-radius:999px;background:var(--mint);color:var(--green);font-size:12px;font-weight:800;padding:6px 10px;display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:999px;background:var(--muted)}.syncing .dot{background:#d78b1f}.ok .dot{background:var(--green-2)}.error .dot{background:var(--danger)}.text-btn{background:transparent;color:var(--green);font-weight:850}.chip-btn,.icon-btn,.primary,.secondary{min-height:38px;border-radius:8px;padding:8px 12px;font-weight:850}.icon-btn{width:38px;padding:0;border:1px solid var(--line);background:var(--card);color:var(--green)}.primary{background:var(--green);color:#fff}.secondary,.chip-btn{background:var(--card);color:var(--green);border:1px solid var(--line)}.danger{color:var(--danger)!important;border-color:#efc9c3!important}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 86px}.view{display:none}.view.active{display:block}.hero{padding:14px 2px 18px}.eyebrow{font-size:13px;color:var(--sage);font-weight:800;margin-bottom:8px}.hero h2{font-size:30px;line-height:1.15}.muted{color:var(--muted);font-size:13px}.grid{display:grid;gap:12px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h3{font-size:18px}.portions{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.portion{padding:16px 10px;border-bottom:1px solid #eef2ea}.portion:nth-child(3n+2),.portion:nth-child(3n+3){border-left:1px solid #eef2ea}.portion span{display:block;color:var(--muted);font-weight:700;font-size:13px;min-height:36px}.portion strong{display:block;margin-top:8px;font-size:25px;font-weight:500;color:var(--green)}.portion small{font-size:13px;color:var(--muted);font-weight:500}.meal-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #eef2ea}.meal-row:last-child{border-bottom:0}.num{width:42px;height:42px;border-radius:999px;border:1px solid var(--line);display:grid;place-items:center;color:var(--sage);font-size:18px}.meal-row h4{font-size:15px}.meal-row p{font-size:12px;color:var(--muted);margin-top:3px}.spacer{flex:1}.bottom-nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:max(env(safe-area-inset-bottom),8px);z-index:20}.nav{flex:1;background:transparent;color:#8b968d;padding:9px 4px 6px;font-size:11px;font-weight:800}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--green)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}.field span{font-size:13px;color:var(--green);font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:42px;padding:9px 11px;color:var(--text);font-size:16px}.food-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fff}.cat-grid{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}.cat{border-radius:999px;padding:7px 9px;background:#f1f4ef;color:var(--muted);font-size:12px;font-weight:850}.cat.active{background:var(--mint);color:var(--green);outline:2px solid #cddfca}.portion-editor{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:rgba(20,33,25,.34);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:var(--cream);border-radius:18px 18px 0 0;width:100%;max-height:92dvh;overflow:auto;padding:18px 14px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.18)}.sheet-title{font-size:20px;font-weight:900;margin-bottom:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;gap:8px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}.history-day{padding:12px;border-bottom:1px solid #eef2ea}.history-day h4{font-size:15px}.history-day p{font-size:12px;color:var(--muted);margin-top:3px}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#1f3126;color:#fff;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:860px){.app{max-width:1180px}.content{padding:32px 64px 88px}.desktop{display:grid;grid-template-columns:1.05fr .95fr;gap:24px}.sheet{max-width:560px;margin:0 auto;border-radius:18px}.modal{align-items:center}.bottom-nav{max-width:520px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}.hero h2{font-size:40px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-main">
      <div class="brand"><div class="logo">☘</div><div><h1>日常食記</h1><small>VIC'S NUTRITION JOURNAL</small></div></div>
      <button class="primary" id="addMealTop">＋ 新增飲食</button>
    </div>
    <div class="sync-row">
      <div class="sync-pill" id="syncStatus"><span class="dot"></span><span id="syncText">本機資料</span></div>
      <button class="chip-btn" id="manualSyncBtn">同步</button>
      <button class="chip-btn" id="authBtn">登入</button>
    </div>
  </header>
  <main class="content">
    <section class="view active" id="todayView">
      <div class="hero"><p class="eyebrow">把日常，慢慢記好</p><h2>今天的飲食與生活</h2><p class="muted" id="todayLabel"></p></div>
      <div class="month-row"><button class="icon-btn" id="prevDay">‹</button><input class="chip-btn" id="dateInput" type="date"><button class="icon-btn" id="nextDay">›</button><span class="spacer"></span><span class="muted">飲食日型</span><select class="chip-btn" id="dayType"><option value="normal">平常日</option><option value="reduce">減量日</option><option value="carb">補碳日</option></select></div>
      <div class="desktop">
        <section class="card"><div class="section-head"><h3>飲食份數</h3><span class="pill" id="dayTypePill">平常日</span></div><div class="portions" id="portionGrid"></div><p class="muted" style="margin-top:14px">目標依目前日型設定。草稿不計入份數。</p></section>
        <section class="card"><div class="section-head"><h3>這一天的餐點</h3><span class="muted" id="mealCount">0 餐</span></div><div id="mealList"></div><button class="secondary" id="addMealEmpty">＋ 新增飲食</button></section>
      </div>
      <section class="card"><div class="section-head"><h3>生活行為</h3><button class="secondary" id="openBehavior">記錄行為</button></div><div class="grid three" id="behaviorSummary"></div><div id="supplementSummary" class="cat-grid"></div></section>
    </section>
    <section class="view" id="historyView"><div class="hero"><p class="eyebrow">回頭看，也看見節奏</p><h2>歷史紀錄</h2></div><div class="card" id="historyList"></div></section>
    <section class="view" id="settingsView"><div class="hero"><p class="eyebrow">只改現在，不追究過去</p><h2>個人設定</h2></div><section class="card"><div class="section-head"><h3>每日飲食目標</h3><select class="chip-btn" id="settingsType"><option value="normal">平常日</option><option value="reduce">減量日</option><option value="carb">補碳日</option></select></div><div class="settings-grid" id="goalSettings"></div></section><section class="card"><div class="section-head"><h3>選項</h3></div><div class="field"><span>運動選項，用逗號分隔</span><textarea id="exerciseOptions"></textarea></div><div class="field"><span>保健品選項，用逗號分隔</span><textarea id="supplementOptions"></textarea></div><button class="primary" id="saveSettings">儲存設定</button></section></section>
  </main>
  <nav class="bottom-nav"><button class="nav active" data-view="todayView"><span>🍴</span>今天</button><button class="nav" data-view="historyView"><span>📅</span>歷史</button><button class="nav" data-view="settingsView"><span>⚙️</span>設定</button></nav>
</div>

<div class="modal" id="mealModal"><div class="sheet"><div class="sheet-title">新增飲食</div><form id="mealForm"><input type="hidden" id="mealId"><div class="grid two"><label class="field"><span>日期</span><input type="date" id="mealDate"></label><label class="field"><span>第幾餐</span><input type="number" min="1" id="mealNumber"></label></div><div id="foodItems"></div><button class="secondary" type="button" id="addFood">＋ 新增食物</button><label class="field"><span>備註</span><textarea id="mealNotes" rows="3"></textarea></label><label class="check"><input type="checkbox" id="mealDraft"> 草稿</label><div class="actions"><button class="secondary" type="button" data-close="mealModal">取消</button><button class="danger secondary" type="button" id="deleteMeal">刪除</button><button class="primary" type="submit">儲存</button></div></form></div></div>
<div class="modal" id="behaviorModal"><div class="sheet"><div class="sheet-title">記錄行為</div><form id="behaviorForm"><div class="grid three"><label class="field"><span>喝水 ml</span><input type="number" min="0" id="water"></label><label class="field"><span>睡眠 小時</span><input type="number" min="0" max="24" step=".5" id="sleep"></label><label class="field"><span>步數</span><input type="number" min="0" id="steps"></label></div><div class="field"><span>運動</span><div class="checks" id="exerciseChecks"></div></div><div class="grid two"><label class="field"><span>排便</span><select id="bowel"><option value="">未記錄</option><option>無</option><option>正常</option><option>便祕</option><option>腹瀉</option></select></label><label class="field"><span>垃圾食物</span><select id="junk"><option value="">未記錄</option><option>無</option><option>有</option></select></label></div><div class="field"><span>保健品</span><div class="checks" id="supplementChecks"></div></div><div class="actions"><button class="secondary" type="button" data-close="behaviorModal">取消</button><button class="primary" type="submit">儲存</button></div></form></div></div>
<div class="modal" id="authModal"><div class="sheet"><div class="sheet-title">登入帳號</div><p class="muted" style="margin-bottom:12px">使用 Google 登入後，飲食紀錄會同步到自己的帳號。</p><div class="actions"><button class="secondary" type="button" data-close="authModal">取消</button><button class="primary" id="googleAuthBtn">使用 Google 登入</button></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const APP_VERSION="2026-09-17-1";
const STORAGE_KEY="vic_nutrition_journal_pwa_v1";
const CLOUD_DOC="nutrition-journal-main";
const FIREBASE_APP_NAME="VicNutritionJournal";
const FIREBASE_CONFIG={apiKey:"AIzaSyBwotH3Ob-lt9EtrTZJnhwQWeWJYsajvlY",authDomain:"vic-nutrition-journal.firebaseapp.com",projectId:"vic-nutrition-journal",storageBucket:"vic-nutrition-journal.firebasestorage.app",messagingSenderId:"487274894737",appId:"1:487274894737:web:f4e28944a91ba0096f7630"};
const FOODS=["乳製品","蔬菜","水果","全穀根莖","低脂豆魚蛋肉","中脂豆魚蛋肉","高脂豆魚蛋肉","堅果油脂","高蛋白"];
const DAY_LABELS={normal:"平常日",reduce:"減量日",carb:"補碳日"};
const NORMAL_TARGETS=[0,5,1,4,5,3,0,2,1];
const DEFAULT_EXERCISES=["重訓","有氧","走路","跑步","瑜伽","羽球"];
const DEFAULT_SUPPLEMENTS=["葉黃素","南非醉茄","甘胺酸鎂","B 群","益生菌","魚油"];
const $=id=>document.getElementById(id);
let state=loadState(),currentDate=today(),settingsType="normal",fbApp=null,auth=null,db=null,fbUser=null,syncTimer=null,isApplying=false;
function makeId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function today(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function addDays(date,n){const d=new Date(date+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function blankGoals(){return FOODS.map(()=>null)}function defaultSettings(){return{goals:{normal:[...NORMAL_TARGETS],reduce:blankGoals(),carb:blankGoals()},exercises:[...DEFAULT_EXERCISES],supplements:[...DEFAULT_SUPPLEMENTS]}}
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return normalize(JSON.parse(raw))}catch{}return normalize({settings:defaultSettings(),meals:[],days:{}})}
function normalize(input){const base={settings:defaultSettings(),meals:[],days:{}};const s={...base,...(input||{})};s.settings={...defaultSettings(),...(s.settings||{})};s.settings.goals={...defaultSettings().goals,...(s.settings.goals||{})};for(const k of ["normal","reduce","carb"])s.settings.goals[k]=FOODS.map((_,i)=>numberOrNull(s.settings.goals[k]?.[i]));s.settings.exercises=cleanList(s.settings.exercises,DEFAULT_EXERCISES);s.settings.supplements=cleanList(s.settings.supplements,DEFAULT_SUPPLEMENTS);s.meals=Array.isArray(s.meals)?s.meals.map(normalizeMeal):[];s.days=s.days&&typeof s.days==="object"?s.days:{};return s}
function cleanList(list,fallback){const arr=Array.isArray(list)?list:fallback;return [...new Set(arr.map(x=>String(x).trim()).filter(Boolean))]}
function numberOrNull(v){const n=Number(v);return Number.isFinite(n)?n:null}
function normalizeMeal(m){return{ id:m.id||makeId(),date:m.date||today(),mealNumber:Number(m.mealNumber||1),notes:String(m.notes||""),draft:!!m.draft,items:Array.isArray(m.items)&&m.items.length?m.items.map(normalizeFood):[normalizeFood({})]}}
function normalizeFood(f){const portions=FOODS.map((_,i)=>Math.max(0,Number(f.portions?.[i]||0)));return{name:String(f.name||""),portions}}
function day(date=currentDate){if(!state.days[date])state.days[date]={date,dayType:"normal",water:null,sleep:null,steps:null,exercise:null,bowel:null,junk:null,supplements:{}};return state.days[date]}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(!isApplying)scheduleSync()}
function totals(date=currentDate){const result=FOODS.map(()=>0);state.meals.filter(m=>m.date===date&&!m.draft).forEach(m=>m.items.forEach(item=>item.portions.forEach((v,i)=>result[i]+=Number(v||0))));return result.map(v=>Math.round(v*100)/100)}
function mealsFor(date=currentDate){return state.meals.filter(m=>m.date===date).sort((a,b)=>a.mealNumber-b.mealNumber||a.id.localeCompare(b.id))}
function mealName(meal){return meal.items.map(i=>i.name).filter(Boolean).join(" + ")||`第 ${meal.mealNumber} 餐`}
function toast(text){$("toast").textContent=text;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}
function render(){renderToday();renderHistory();renderSettings();renderAuth()}
function renderToday(){const d=day();$("todayLabel").textContent=new Intl.DateTimeFormat("zh-TW",{month:"long",day:"numeric",weekday:"long",timeZone:"Asia/Taipei"}).format(new Date(currentDate+"T12:00:00Z"));$("dateInput").value=currentDate;$("dayType").value=d.dayType||"normal";$("dayTypePill").textContent=DAY_LABELS[d.dayType||"normal"];const t=totals();const goals=state.settings.goals[d.dayType||"normal"];$("portionGrid").innerHTML=FOODS.map((food,i)=>`<div class="portion"><span>${food}</span><strong>${goals[i]!==null?`${t[i]} / ${goals[i]}`:t[i]} <small>份</small></strong></div>`).join("");const meals=mealsFor();$("mealCount").textContent=`${meals.length} 餐`;$("mealList").innerHTML=meals.length?meals.map(m=>`<div class="meal-row" data-edit="${m.id}"><div class="num">${String(m.mealNumber).padStart(2,"0")}</div><div><p>第 ${m.mealNumber} 餐${m.draft?" · 草稿":""}</p><h4>${escapeHtml(mealName(m))}</h4><p>${mealSummary(m)}</p></div><span class="spacer"></span><button class="text-btn" data-edit="${m.id}">›</button></div>`).join(""):`<p class="muted">還沒有餐點。</p>`;$("behaviorSummary").innerHTML=[["喝水",d.water,"ml"],["睡眠",d.sleep,"小時"],["步數",d.steps,"步"]].map(([a,b,c])=>`<div><p class="muted">${a}</p><strong>${b===null||b===""?"—":Number(b).toLocaleString()} <small>${c}</small></strong></div>`).join("");$("supplementSummary").innerHTML=state.settings.supplements.map(s=>`<span class="cat ${d.supplements?.[s]==="已服用"?"active":""}">${s} ${d.supplements?.[s]||"未記錄"}</span>`).join("")}
function mealSummary(m){return m.items.flatMap(item=>item.portions.map((v,i)=>v>0?`${FOODS[i]} ${v}`:null).filter(Boolean)).join("、")||"未填份數"}
function renderHistory(){const dates=[...new Set([...state.meals.map(m=>m.date),...Object.keys(state.days)])].sort().reverse();$("historyList").innerHTML=dates.length?dates.map(date=>{const sum=totals(date).reduce((a,b)=>a+b,0);const count=mealsFor(date).length;return`<div class="history-day" data-date="${date}"><h4>${date}</h4><p>${count} 餐 · 份數合計 ${Math.round(sum*100)/100}</p></div>`}).join(""):`<p class="muted">尚無紀錄。</p>`}
function renderSettings(){const goals=state.settings.goals[settingsType];$("settingsType").value=settingsType;$("goalSettings").innerHTML=FOODS.map((f,i)=>`<label class="field"><span>${f}目標</span><input type="number" step=".5" data-goal="${i}" value="${goals[i]??""}" placeholder="未設定"></label>`).join("");$("exerciseOptions").value=state.settings.exercises.join("、");$("supplementOptions").value=state.settings.supplements.join("、")}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function openModal(id){$(id).classList.add("open")}function closeModal(id){$(id).classList.remove("open")}
function newMeal(){openMeal({date:currentDate,mealNumber:Math.max(0,...mealsFor().map(m=>m.mealNumber))+1,items:[normalizeFood({})],notes:"",draft:false})}
function openMeal(meal){$("mealId").value=meal.id||"";$("mealDate").value=meal.date;$("mealNumber").value=meal.mealNumber;$("mealNotes").value=meal.notes||"";$("mealDraft").checked=!!meal.draft;renderFoodItems(meal.items);$("deleteMeal").style.display=meal.id?"inline-flex":"none";openModal("mealModal")}
function renderFoodItems(items){$("foodItems").innerHTML=items.map((item,idx)=>`<div class="food-card" data-food="${idx}"><label class="field"><span>食物名稱</span><input data-food-name="${idx}" value="${escapeHtml(item.name)}" placeholder="例如：燙青菜"></label><div class="portion-editor">${FOODS.map((f,i)=>`<label class="field"><span>${f}</span><input type="number" min="0" step=".5" data-portion="${idx}:${i}" value="${item.portions[i]||""}" placeholder="0"></label>`).join("")}</div><button class="secondary" type="button" data-remove-food="${idx}">刪除食物</button></div>`).join("")}
function collectMeal(){const items=[...document.querySelectorAll("[data-food]")].map(card=>{const idx=card.dataset.food;return{name:document.querySelector(`[data-food-name="${idx}"]`).value.trim(),portions:FOODS.map((_,i)=>Number(document.querySelector(`[data-portion="${idx}:${i}"]`).value||0))}}).filter(item=>item.name||item.portions.some(Boolean));return{id:$("mealId").value||makeId(),date:$("mealDate").value,mealNumber:Number($("mealNumber").value||1),notes:$("mealNotes").value.trim(),draft:$("mealDraft").checked,items:items.length?items:[normalizeFood({name:"未命名食物"})]}}
function openBehavior(){const d=day();$("water").value=d.water??"";$("sleep").value=d.sleep??"";$("steps").value=d.steps??"";$("bowel").value=d.bowel||"";$("junk").value=d.junk||"";$("exerciseChecks").innerHTML=state.settings.exercises.map(s=>`<label class="check"><input type="checkbox" value="${escapeHtml(s)}" ${d.exercise?.includes(s)?"checked":""}> ${escapeHtml(s)}</label>`).join("");$("supplementChecks").innerHTML=state.settings.supplements.map(s=>`<label class="check"><input type="checkbox" value="${escapeHtml(s)}" ${d.supplements?.[s]!=="未服用"?"checked":""}> ${escapeHtml(s)}</label>`).join("");openModal("behaviorModal")}
function setSyncStatus(status,text){$("syncStatus").className=`sync-pill ${status||""}`.trim();$("syncText").textContent=text}
function googleProvider(){const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:"select_account"});return provider}
function cloudRef(){if(!db||!fbUser)return null;return db.collection("users").doc(fbUser.uid).collection("data").doc(CLOUD_DOC)}
function cloudPayload(){return{schemaVersion:1,updatedAt:Date.now(),state}}
function applyCloudPayload(data){isApplying=true;state=normalize(data?.state||{});localStorage.setItem(STORAGE_KEY,JSON.stringify(state));isApplying=false;render()}
function scheduleSync(){if(!fbUser||!db)return;clearTimeout(syncTimer);setSyncStatus("syncing","同步中");syncTimer=setTimeout(syncToCloud,900)}
async function syncToCloud(){const ref=cloudRef();if(!ref)return;try{await ref.set(cloudPayload());setSyncStatus("ok","已同步")}catch(e){console.error(e);setSyncStatus("error","同步失敗")}}
async function syncFromCloud(){const ref=cloudRef();if(!ref)return;try{setSyncStatus("syncing","同步中");const doc=await ref.get();if(doc.exists)applyCloudPayload(doc.data());else await syncToCloud();setSyncStatus("ok","已同步")}catch(e){console.error(e);setSyncStatus("error","同步失敗")}}
function renderAuth(){if(!fbUser){$("authBtn").textContent="登入";$("authBtn").classList.remove("danger");return}$("authBtn").textContent="登出";$("authBtn").classList.add("danger")}
async function initCloud(){if(!window.firebase){setSyncStatus("error","雲端未載入");return}try{fbApp=firebase.apps.find(app=>app.name===FIREBASE_APP_NAME)||firebase.initializeApp(FIREBASE_CONFIG,FIREBASE_APP_NAME);auth=firebase.auth(fbApp);db=firebase.firestore(fbApp);await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);setSyncStatus("syncing","連線中");auth.onAuthStateChanged(async user=>{fbUser=user||null;renderAuth();if(user)await syncFromCloud();else setSyncStatus("","請登入")})}catch(e){console.error(e);setSyncStatus("error","雲端失敗")}}
function parseList(text){return cleanList(text.split(/[、,\n]/),[])}
document.addEventListener("click",e=>{const edit=e.target.closest("[data-edit]")?.dataset.edit;if(edit){openMeal(state.meals.find(m=>m.id===edit));return}const date=e.target.closest("[data-date]")?.dataset.date;if(date){currentDate=date;showView("todayView");render();return}const close=e.target.closest("[data-close]")?.dataset.close;if(close)closeModal(close);const remove=e.target.closest("[data-remove-food]")?.dataset.removeFood;if(remove!==undefined){const items=[...document.querySelectorAll("[data-food]")].map((_,i)=>normalizeFood({name:document.querySelector(`[data-food-name="${i}"]`)?.value||"",portions:FOODS.map((__,j)=>Number(document.querySelector(`[data-portion="${i}:${j}"]`)?.value||0))}));items.splice(Number(remove),1);renderFoodItems(items.length?items:[normalizeFood({})])}})
document.querySelectorAll(".nav").forEach(btn=>btn.addEventListener("click",()=>showView(btn.dataset.view)));function showView(id){document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===id));document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.view===id));render()}
$("addMealTop").onclick=newMeal;$("addMealEmpty").onclick=newMeal;$("openBehavior").onclick=openBehavior;$("prevDay").onclick=()=>{currentDate=addDays(currentDate,-1);render()};$("nextDay").onclick=()=>{currentDate=addDays(currentDate,1);render()};$("dateInput").onchange=e=>{currentDate=e.target.value;render()};$("dayType").onchange=e=>{day().dayType=e.target.value;save();render()};$("settingsType").onchange=e=>{settingsType=e.target.value;renderSettings()};$("addFood").onclick=()=>{const items=[...document.querySelectorAll("[data-food]")].map((_,i)=>normalizeFood({name:document.querySelector(`[data-food-name="${i}"]`)?.value||"",portions:FOODS.map((__,j)=>Number(document.querySelector(`[data-portion="${i}:${j}"]`)?.value||0))}));items.push(normalizeFood({}));renderFoodItems(items)};$("mealForm").onsubmit=e=>{e.preventDefault();const meal=collectMeal();const idx=state.meals.findIndex(m=>m.id===meal.id);if(idx>=0)state.meals[idx]=meal;else state.meals.push(meal);currentDate=meal.date;save();closeModal("mealModal");render();toast("餐點已儲存")};$("deleteMeal").onclick=()=>{const id=$("mealId").value;state.meals=state.meals.filter(m=>m.id!==id);save();closeModal("mealModal");render();toast("已刪除")};
$("behaviorForm").onsubmit=e=>{e.preventDefault();const d=day();d.water=numberOrNull($("water").value);d.sleep=numberOrNull($("sleep").value);d.steps=numberOrNull($("steps").value);d.exercise=[...$("exerciseChecks").querySelectorAll("input:checked")].map(x=>x.value);d.bowel=$("bowel").value||null;d.junk=$("junk").value||null;d.supplements={};state.settings.supplements.forEach(s=>{d.supplements[s]=$("supplementChecks").querySelector(`input[value="${CSS.escape(s)}"]`)?.checked?"已服用":"未服用"});save();closeModal("behaviorModal");render();toast("行為已儲存")};
$("saveSettings").onclick=()=>{state.settings.goals[settingsType]=FOODS.map((_,i)=>numberOrNull(document.querySelector(`[data-goal="${i}"]`).value));state.settings.exercises=parseList($("exerciseOptions").value);state.settings.supplements=parseList($("supplementOptions").value);save();render();toast("設定已儲存")};$("authBtn").onclick=()=>fbUser?auth.signOut():openModal("authModal");$("googleAuthBtn").onclick=async()=>{try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);await auth.signInWithPopup(googleProvider());closeModal("authModal")}catch(e){console.error(e);toast("登入失敗")}};$("manualSyncBtn").onclick=async()=>{if(!fbUser){openModal("authModal");return}await syncFromCloud();await syncToCloud();toast("同步完成")};
if("serviceWorker" in navigator){let refreshing=false;navigator.serviceWorker.register("sw.js").then(reg=>{if(reg.waiting)reg.waiting.postMessage("SKIP_WAITING");reg.update();reg.addEventListener("updatefound",()=>{const worker=reg.installing;if(worker)worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&reg.waiting)reg.waiting.postMessage("SKIP_WAITING")})})});navigator.serviceWorker.addEventListener("controllerchange",()=>{if(refreshing)return;refreshing=true;location.reload()})}
render();initCloud();
</script>
</body>
</html>
